name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.8.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # No Outline credentials in CI: builds the empty starter site to catch config/theme breakage
      - name: Build
        run: pnpm docs:build

      # Builds a site from fixture Outline documents (through the real sync code) and checks its HTML:
      # post cards, drafts and unlisted pages, RSS/sitemap, escaping, links and backlinks
      - name: Built-site checks
        run: pnpm test:site
